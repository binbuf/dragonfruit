[workspace]
resolver = "2"
members = [
    "compositor",
    "portal",
    "protocols/df-ipc",
    "services/menu-broker",
    "services/settingsd",
    "services/app-index",
    "services/session",
    "tools/dragonfruit-dev",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dragonfruit-desktop/dragonfruit"
rust-version = "1.80.1"

# Pinned dependency set.
#
# Smithay is pinned to an exact version on purpose: upgrades are deliberate,
# mechanical events, never pulled in transitively (see .docs/design/14-risks.md
# and docs/ipc-versioning.md for the lockstep rules that apply to the rest of
# the dependency set).
#
# Feature set (T-02): all three backends ship in one binary, so the DRM/GBM/
# libinput/udev/libseat backend stack is always compiled in; backend selection
# happens at runtime with `--backend`. `desktop` provides the window/scene
# primitives, `renderer_multi` the multi-GPU path.
[workspace.dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_glow",
    "renderer_multi",
    "wayland_frontend",
    # Xwayland integration (T-06): X11 clients are managed through Smithay's
    # X11Wm and the xwayland_shell protocol.
    "xwayland",
] }
calloop = { version = "=0.14.4", features = ["signals"] }
libc = "0.2"
wayland-server = "=0.31.10"
# DRM connector scanning helpers (kept in lockstep with the smithay pin).
smithay-drm-extras = { version = "0.1.0", default-features = false }

df-ipc = { path = "protocols/df-ipc", version = "0.1.0" }

[profile.release]
lto = "thin"
