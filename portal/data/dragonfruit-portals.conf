; Dragonfruit portal preference (T-13.1a).
;
; Installed as {DATADIR}/xdg-desktop-portal/dragonfruit-portals.conf, which the
; xdg-desktop-portal frontend prefers whenever XDG_CURRENT_DESKTOP is
; `dragonfruit`. Our backend is tried first for every interface, then the
; generic GTK backend as a fallback for the interfaces we do not implement, so
; Flatpak and browser apps keep working even before the whole T-13 matrix
; lands.
[preferred]
default=dragonfruit;gtk