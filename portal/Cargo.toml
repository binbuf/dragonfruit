[package]
# The package name is the design's short name (`dragonfruit-portal`); the
# installed binary keeps the xdg-desktop-portal backend name. The task gate
# addresses the package, the packaging scripts address the binary.
name = "dragonfruit-portal"
description = "Dragonfruit xdg-desktop-portal backend: the session-bus service and its registration (T-13.1a)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "xdg_desktop_portal_dragonfruit"
path = "src/lib.rs"

[[bin]]
name = "xdg-desktop-portal-dragonfruit"
path = "src/main.rs"

# The portal backend is a session-bus service, discovered by the
# `xdg-desktop-portal` frontend from the `dragonfruit.portal` descriptor and
# `dragonfruit-portals.conf` shipped in `portal/data/` (T-13.1a). It owns the
# standard backend name `org.freedesktop.impl.portal.desktop.dragonfruit` at
# `/org/freedesktop/portal/desktop`; the concrete portal interfaces are added
# additively by T-13.1b…T-13.7.
#
# zbus is the same pinned D-Bus stack the other service crates use.
[dependencies]
df-ipc.workspace = true
# The FileChooser portal browses with the one browsing core (T-13.2a,
# 09-files.md): `Location` normalizes the presenter's selection into the
# portal's `file://` URIs and `DirectoryModel`/`StdFsSource` is the listing
# seam the picker UI drives. A library link, never a process.
dragonfruit-files-core = { path = "../services/files-core", version = "0.3.0" }
zbus = { version = "=5.19.0", features = ["blocking-api"] }
# T311: the bounded wait every interactive completion uses. `async-io` is the
# same reactor zbus runs the service on, so a timeout never needs a second
# executor; `futures-lite` provides the race and the one-shot poll.
async-io = "=2.6.0"
futures-lite = "=2.6.1"
# T335b: the live screen-share bridge is a trusted client of the private
# protocol (ADR 0346). `wayland-client` is the compositor-tested runtime the
# generated bindings are written against; `wayland-scanner` generates them at
# build time from the one checked-in XML. The only other libc surface is
# `poll(2)` for the bounded create wait.
wayland-client = "0.31"
wayland-scanner = "0.31"
# Referenced by the generated 0.31 bindings and by the scanner's bitfield
# enums; both stay pinned in lockstep with `wayland-client` via `Cargo.lock`.
wayland-backend = "0.3"
bitflags = "2"
libc = "0.2"

[dev-dependencies]
serde = "=1.0.229"
# T-13.1b: the Settings portal integration test serves a real settingsd
# object on a private bus and checks the projection against it. This is a
# dev-only link; the shipped backend reads settingsd over D-Bus, never as a
# library.
dragonfruit-settingsd = { path = "../services/settingsd", version = "0.3.0" }