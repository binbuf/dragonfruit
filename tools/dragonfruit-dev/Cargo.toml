[package]
name = "dragonfruit-dev"
description = "dragonfruit dev --nested: the daily development command (T-01)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dragonfruit"
path = "src/main.rs"

[dependencies]
calloop.workspace = true
df-ipc.workspace = true
libc.workspace = true
# The dev-session state file (T-12.6b) is the same contract the session entry
# reads to export DRAGONFRUIT_DEV_RETURN.
dragonfruit-session = { path = "../../services/session", version = "0.1.0" }
