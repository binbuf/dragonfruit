[package]
name = "dragonfruit-printer-adapter"
description = "Printers and Scanners adapter: CUPS queues and SANE devices, state, events, and absence (T-15.12a)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The adapter projects the host stack, which has two independent halves, both
# reused, never reimplemented: the **printers** half is CUPS (read/written
# through the client tools CUPS ships: `lpstat`/`lpadmin`/`cupsaccept`/
# `cupsreject`/`cancel`), and the **scanners** half is SANE (`scanimage -L`).
# This mirrors the audio adapter (`pw-dump`/`wpctl`) and the input adapter
# (`libinput list-devices`): the tools' human-oriented output churn is pinned
# in one parser and stays behind the `PrintSource` seam. The dependency-free
# contract lives in `dragonfruit-system-adapters`.
[dependencies]
dragonfruit-system-adapters = { path = "../system-adapters", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lib]
name = "dragonfruit_printer_adapter"
path = "src/lib.rs"