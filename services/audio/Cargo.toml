[package]
name = "dragonfruit-audio"
description = "PipeWire/WirePlumber audio adapter: default sink volume/mute and per-sink list (T-07.3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The concrete adapter owns its daemon stack. Audio is reached through
# WirePlumber's control CLI (read as `pw-dump` JSON, write as `wpctl`) — no
# `libpipewire` link, because there is no stable D-Bus volume API and the
# native headers are not part of the pinned toolchain
# (see docs/design/adr/0028-audio-adapter-over-wireplumber-cli.md). The
# dependency-free contract lives in `dragonfruit-system-adapters` and nothing
# above this crate sees a PipeWire/WirePlumber type.
[dependencies]
dragonfruit-system-adapters = { path = "../system-adapters", version = "0.1.0" }
serde_json = "=1.0.151"

[lib]
name = "dragonfruit_audio"
path = "src/lib.rs"