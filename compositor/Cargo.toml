[package]
name = "dragonfruit-compositor"
description = "Dragonfruit Wayland compositor (Rust + Smithay)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The compositor is a thin policy layer over Smithay. Smithay is pinned to an
# exact version for the whole workspace (see the root Cargo.toml); upgrades
# are deliberate, mechanical events (.docs/design/14-risks.md).
[dependencies]
smithay.workspace = true
calloop.workspace = true
libc.workspace = true
df-ipc.workspace = true
smithay-drm-extras.workspace = true
# Private shell protocols (T-07): the XMLs are compiled into server
# bindings by wayland-scanner; wayland-server/wayland-backend are the
# runtime they are generated against.
wayland-server.workspace = true
wayland-scanner = "0.31"
wayland-backend = "0.3"
# bitflags is referenced by wayland-scanner's generated bitfield enums.
bitflags = "2"

[dev-dependencies]
# Server-side test client: the protocol-surface smoke test connects to the
# headless compositor and asserts the exact advertised global set; the
# window-conformance suite drives xdg_toplevel/xdg_popup requests against
# the same headless backend (T-04).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
# X11 client for the Xwayland conformance test (T-06): creates a window over
# the X protocol and asserts it appears in the WM's `_NET_CLIENT_LIST`.
x11rb = "0.13"
