# SPDX-License-Identifier: MIT
#
# Release assets: one staged install tree, published as a portable tar.gz,
# a Debian binary package, a Fedora binary RPM, an Arch binary package, and a
# source tarball.
#
# Triggered by a `v*` tag (or a manual dispatch for a dry run). The publish
# job only runs for tags; manual runs leave the artifacts on the workflow run.
#
# Each package is built on the oldest supported release of its family, against
# that release's own Qt, so the binary runs on newer releases of the same
# family and the declared dependency version is the one it was built with. No
# Qt or system library is bundled inside a distro package. The smoke test
# installs the package in the same container and checks the session entry and
# that every ELF resolves its shared libraries.
#
# These are early-testing binary assets, not official distro packages. T164
# and T165 still own Fedora review/COPR and Debian policy/source packaging.

name: Release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Debian 13 DEB + portable tar
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Dragonfruit $version"

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
            libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev \
            libinput-dev libseat-dev libudev-dev libsystemd-dev \
            libdbus-1-dev libegl-dev libgl-dev \
            xwayland dpkg-dev fakeroot binutils file zstd \
            curl ca-certificates git

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build DEB + tar
        run: |
          set -o pipefail
          scripts/package.sh \
            --version "${{ steps.version.outputs.value }}" \
            --output dist \
            --formats tar,deb 2>&1 | tee build-deb.log

      - name: Build diagnostics
        if: failure()
        run: |
          if [ -f build-deb.log ]; then
            tail -n 200 build-deb.log | base64 -w0 | fold -w 60000 | while IFS= read -r line; do
              echo "::error::LOG:$line"
            done
          fi

      - name: Install smoke test
        run: |
          set -o pipefail
          {
            apt-get install -y ./dist/*.deb
            dpkg -L dragonfruit-desktop \
              | grep -qx /usr/share/wayland-sessions/dragonfruit.desktop
            for b in /usr/bin/dragonfruit-* /usr/bin/xdg-desktop-portal-dragonfruit; do
              [ -x "$b" ] || continue
              file "$b" | grep -q ELF || continue
              if ldd "$b" | grep -q 'not found'; then
                echo "unresolved shared libraries in $b"
                ldd "$b"
                exit 1
              fi
            done
          } 2>&1 | tee smoke-deb.log

      - name: Smoke diagnostics
        if: failure()
        run: |
          if [ -f smoke-deb.log ]; then
            tail -n 200 smoke-deb.log | base64 -w0 | fold -w 60000 | while IFS= read -r line; do
              echo "::error::LOG:$line"
            done
          fi

      - name: Source tarball
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="dragonfruit-${{ steps.version.outputs.value }}/" \
            -o "dist/dragonfruit-${{ steps.version.outputs.value }}-source.tar.gz" \
            HEAD

      - name: Refresh checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS

      - name: Upload tar/deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-tar-deb
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  rpm:
    name: Fedora 43 binary RPM
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install git for checkout
        run: dnf install -y git tar gzip ca-certificates

      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Dragonfruit $version"

      - name: Install build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake ninja-build pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            wayland-devel libxkbcommon-devel libdrm-devel \
            mesa-libgbm-devel mesa-libEGL-devel libglvnd-devel \
            libinput-devel libseat-devel systemd-devel dbus-devel \
            rpm-build binutils file curl tar gzip findutils

      - name: Install pinned Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build RPM
        run: |
          set -o pipefail
          scripts/package.sh \
            --version "${{ steps.version.outputs.value }}" \
            --output dist \
            --formats rpm 2>&1 | tee build-rpm.log

      - name: Build diagnostics
        if: failure()
        run: |
          if [ -f build-rpm.log ]; then
            tail -n 200 build-rpm.log | base64 -w0 | fold -w 60000 | while IFS= read -r line; do
              echo "::error::LOG:$line"
            done
          fi

      - name: Install smoke test
        run: |
          dnf install -y ./dist/*.rpm
          rpm -ql dragonfruit-desktop \
            | grep -qx /usr/share/wayland-sessions/dragonfruit.desktop
          for b in /usr/bin/dragonfruit-* /usr/bin/xdg-desktop-portal-dragonfruit; do
            [ -x "$b" ] || continue
            file "$b" | grep -q ELF || continue
            if ldd "$b" | grep -q 'not found'; then
              echo "unresolved shared libraries in $b"
              ldd "$b"
              exit 1
            fi
          done

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: |
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error

  arch:
    name: Arch binary package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install git for checkout
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git ca-certificates

      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Dragonfruit $version"

      - name: Install build deps
        run: |
          pacman -S --noconfirm --needed \
            base-devel pkgconf cmake ninja \
            qt6-base qt6-declarative qt6-wayland \
            wayland libxkbcommon libdrm mesa libinput seatd \
            systemd-libs dbus pam \
            zstd libarchive file curl tar gzip

      - name: Install pinned Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Arch package
        run: |
          set -o pipefail
          scripts/package.sh \
            --version "${{ steps.version.outputs.value }}" \
            --output dist \
            --formats arch 2>&1 | tee build-arch.log

      - name: Build diagnostics
        if: failure()
        run: |
          if [ -f build-arch.log ]; then
            tail -n 200 build-arch.log | base64 -w0 | fold -w 60000 | while IFS= read -r line; do
              echo "::error::LOG:$line"
            done
          fi

      - name: Install smoke test
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          pacman -Ql dragonfruit-desktop \
            | grep -q '/usr/share/wayland-sessions/dragonfruit.desktop'
          for b in /usr/bin/dragonfruit-* /usr/bin/xdg-desktop-portal-dragonfruit; do
            [ -x "$b" ] || continue
            file "$b" | grep -q ELF || continue
            if ldd "$b" | grep -q 'not found'; then
              echo "unresolved shared libraries in $b"
              ldd "$b"
              exit 1
            fi
          done

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, rpm, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
